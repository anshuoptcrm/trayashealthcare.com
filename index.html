<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain For Sale</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            background: #070b17;
        }

        /* Animated Background */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #6c5ce7;
            top: -180px;
            left: -150px;
        }

        body::after {
            background: #00cec9;
            right: -180px;
            bottom: -180px;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(50px, 40px);
            }
        }

        /* Main Card */
        .container {
            position: relative;
            z-index: 2;
            width: min(92%, 850px);
            padding: 70px 50px;
            text-align: center;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Small Badge */
        .badge {
            display: inline-block;
            padding: 9px 20px;
            margin-bottom: 28px;

            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;

            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            color: #dfe6ff;
        }

        /* Heading */
        h1 {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 22px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #a8b8ff,
                #76e6df,
                #ffffff
            );

            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 250% center;
            }
        }

        .subtitle {
            color: #b8bfd6;
            font-size: 18px;
            line-height: 1.7;
            max-width: 620px;
            margin: 0 auto 40px;
        }

        /* Contact Box */
        .contact-box {
            display: inline-flex;
            align-items: center;
            gap: 15px;

            padding: 18px 25px;
            margin-bottom: 32px;

            border-radius: 16px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .email-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
        }

        .email {
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
        }

        .email:hover {
            color: #76e6df;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 16px 32px;
            border-radius: 50px;

            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;

            background: linear-gradient(135deg, #6c5ce7, #00b894);

            box-shadow: 0 12px 30px rgba(0, 184, 148, 0.25);

            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0, 184, 148, 0.35);
        }

        .footer {
            margin-top: 45px;
            font-size: 12px;
            color: #777f9a;
            letter-spacing: 1px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                padding: 50px 22px;
                border-radius: 24px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .subtitle {
                font-size: 16px;
            }

            .contact-box {
                width: 100%;
                justify-content: center;
                padding: 15px;
            }

            .email {
                font-size: 14px;
            }

            .email-icon {
                width: 40px;
                height: 40px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            Premium Domain
        </div>

        <h1>
            This Domain<br>
            Is For Sale
        </h1>

        <p class="subtitle">
            Looking for the perfect domain for your next business,
            startup, brand or project?
            <br>
            This domain could be yours.
        </p>

        <div class="contact-box">

            <div class="email-icon">
                ✉
            </div>

            <a class="email"
               href="mailto:intechglobalsolution@gmail.com">
                intechglobalsolution@gmail.com
            </a>

        </div>

        <br>

        <a class="btn"
           href="mailto:intechglobalsolution@gmail.com?subject=Domain%20Purchase%20Inquiry">
            ✉ Contact Us
        </a>

        <div class="footer">
            © 2026 • Domain Acquisition Opportunity
        </div>

    </div>

</body>
</html>
